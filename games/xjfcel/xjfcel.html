<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>空当接龙 - 经典JS版</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='75' font-size='85' font-weight='900' fill='%23DAA520' text-anchor='middle' style='font-family: Arial, Helvetica, sans-serif;'>K</text></svg>">
    <style>
        html, body {
            height: 100%; /* Ensure html and body take full viewport height */
            overscroll-behavior: none; /* 1. 在根元素禁止，防止整个页面被下拉 */
        }
        :root {
            --win-bg: #017f01;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none; /* 兼容Safari：禁止文本选择 */
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent; /* 移除点击高亮 */
            -webkit-touch-callout: none; /* 禁用iOS系统长按菜单 */
        }
        body {
            background-color: var(--win-bg);
            margin: 0;
            font-family: "Tahoma", sans-serif;
            overflow: hidden; /* 3. 确保 body 不滚动，只让 page-container 滚动 */
            display: flex; /* Make body a flex container */
            flex-direction: column; /* Stack page-container vertically */
        }
        .page-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1; /* Allow page-container to grow and fill available space */
            margin: 0 auto; /* Keep for horizontal centering */
            overflow-y: auto; /* Allow page-container to scroll if its content overflows */
            overscroll-behavior: none; /* 2. 在滚动容器上禁止，防止滚动到顶端时触发父级下拉 */
        }
        .main-area {
            display: flex;
            flex-direction: column; /* Default: canvas above controls */
            flex-grow: 1;
        }
        .sidebar-wrapper {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .top-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            height: 40px;
            padding: 0;
            font-size: 16px;
            flex-shrink: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        #game-title {
            font-size: 18px;
            font-weight: bold;
            line-height: 1;
            margin-left: 2px;
        }
        .game-canvas {
            position: relative;
            width: 100%;
            flex-grow: 1; /* Canvas grows to fill space in main-area */
            transition: min-height 0.2s ease-out; /* 添加高度变化的过渡动画 */
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 14px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .status-bar > span:first-child { flex: 1; text-align: left; }
        .status-bar > span:last-child { flex: 1; text-align: right; }
        .status-bar a {
            color: #DAA520;
            text-decoration: none;
        }
        .status-bar a:hover {
            text-decoration: underline;
        }
        .bottom-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 6px 0;
            flex-shrink: 0;
        }
        .control-btn {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 3px 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Tahoma', sans-serif;
            min-width: 80px;
            height: auto;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 3px;
        }
        .control-btn:active {
            border-color: #808080 #ffffff #ffffff #808080;
        }
        .control-btn:disabled {
            color: #888;
            text-shadow: 1px 1px 0 #fff;
            pointer-events: none;
        }
        .slot-row { position: absolute; display: flex; width: 100%; justify-content: space-between; pointer-events: none; }
        .group { display: flex; gap: 6px; }
        .slot {
            border: 1px solid rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        #free-group .slot::before,
        #found-group .slot::before {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: var(--bg-icon-size, 72px);
            color: rgba(0, 0, 0, 0.15);
            font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            z-index: 0;
        }
        .card.selected {
            box-shadow: 0 0 5px 2px rgba(255, 215, 0, 0.8);
            z-index: 998;
        }
        .hint-glow {
            box-shadow: 0 0 5px 2px #00BFFF !important;
            z-index: 999 !important;
        }
        .col-hint-box {
            position: absolute;
            border: 2px solid #00BFFF;
            box-shadow: 0 0 5px 2px #00BFFF;
            border-radius: 4px;
            pointer-events: none;
            z-index: 990;
        }
        #free-group .slot::before { content: '〇'; }
        #found-group .slot:nth-child(1)::before { content: '♣'; }
        #found-group .slot:nth-child(2)::before { content: '♦'; color: rgba(255, 0, 0, 0.1); }
        #found-group .slot:nth-child(3)::before { content: '♥'; color: rgba(255, 0, 0, 0.1); }
        #found-group .slot:nth-child(4)::before { content: '♠'; }
        .card {
            position: absolute; background: white; border: 1px solid #000; border-radius: 4px;
            cursor: pointer; font-size: 14px; z-index: 10;
            transition: left 0.2s ease-out, top 0.2s ease-out;
            overflow: hidden;
            font-family: "Segoe UI", "Roboto", "Helvetica Neue", Arial, sans-serif;
            transform: translateZ(0); /* 开启硬件加速，优化移动端性能 */
            touch-action: auto; /* 默认允许浏览器处理触摸（如滚动） */
        }
        .card.draggable {
            touch-action: pinch-zoom; /* 可拖拽的牌禁止浏览器平移，由JS接管 */
        }
        .card[data-type="cols"]:not(.draggable) {
            background-color: #e0e0e0; /* 不可拖动的牌背景变暗 */
        }
        .card.red { color: #ff0000; }
        .card.black { color: #000000; }
        .card-inner { padding: 2px 4px; position: relative; height: 100%; pointer-events: none; }
        .card-header {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            line-height: 1;
        }
        .rank { font-weight: bold; letter-spacing: -1px; }
        .suit-s { font-size: 0.9em; }
        .suit-l {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -5px;
            opacity: 0.8;
        }
        .dragging { z-index: 1000 !important; transition: none !important; pointer-events: none; }
        
        /* 瀑布画布 */
        #victory-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100; display: none;
        }
        .lang-btn {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 0 5px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Tahoma', sans-serif;
            border-radius: 2px;
            margin-right: 5px;
        }
        .lang-btn:active {
            background: rgba(255,255,255,0.2);
        }

        /* 移动端适配 */
        @media (max-width: 600px), (max-height: 500px) {
            .top-info {
                font-size: 14px;
            }
            .status-bar {
                font-size: 12px;
            }
            #game-title {
                font-size: 18px;
            }
            .bottom-controls {
                gap: 8px;
                padding: 6px 0;
            }
            .control-btn {
                font-size: 15px;
                min-width: 0; /* 覆盖PC端的min-width，允许按钮收缩 */
                flex: 1; /* 让按钮平分剩余空间 */
                padding: 5px 2px; /* 调整内边距以适应小屏幕 */
                height: auto;
            }
            .card-inner { padding: 2px; }
        }

        /* 宽屏横向布局 (e.g. 手机横屏) */
        .page-container.landscape-wide .main-area {
            flex-direction: row; /* canvas is left, controls are right */
            flex: 1;
        }
        .page-container.landscape-wide .sidebar-wrapper {
            width: 108px; /* Fixed width for the side bar */
        }
        .page-container.landscape-wide .status-bar {
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            padding: 5px 5px;
        }
        .page-container.landscape-wide .status-bar > span {
            flex: 0 !important;
            text-align: center !important;
        }
        .page-container.landscape-wide .bottom-controls {
            flex-direction: column;
            height: auto; /* Height will be determined by flex container */
            padding: 10px 10px;
            gap: 14px;
            justify-content: center;
            align-items: center;
        }
        .page-container.landscape-wide .control-btn {
            min-width: 80px;
        }

        .invalid-move-tip {
            position: fixed;
            bottom: auto;
            top: 2px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #ffffcc;
            border: 1px solid #808080;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 16px;
            color: #000;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
            z-index: 9000;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            max-width: 400px;
            word-break: break-word;
        }

        .invalid-move-tip.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .invalid-move-tip .tip-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .invalid-move-tip .tip-text {
            line-height: 1.4;
        }

        @media (max-width: 400px) {
            .invalid-move-tip {
                top: 2px;
                left: 4px;
                right: 4px;
                font-size: 14px;
                max-width: none;
            }

            .invalid-move-tip.visible {
                transform: translateY(0);
            }
        }

        /* --- 自定义 Windows XP 风格 MsgBox --- */
        .msgbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* 半透明遮罩 */
            z-index: 9999;
        }
        .msgbox-window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ece9d8;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.5);
            min-width: 280px;
            max-width: 90%;
        }
        .msgbox-window .title-bar { background: #0a246a; color: white; padding: 4px 8px; margin-bottom: 6px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .msgbox-window .title-bar .title { display: flex; align-items: center; gap: 6px; }
        .msgbox-window .window-controls { display: flex; gap: 2px; }
        .msgbox-window .win-btn { width: 20px; height: 20px; background: #ece9d8; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff; font-size: 14px; line-height: 16px; text-align: center; color: #000; cursor: default; }
        .msgbox-content { padding: 20px 15px; display: flex; align-items: flex-start; gap: 15px; }
        .msgbox-icon { font-size: 32px; line-height: 1; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2)); }
        .msgbox-text { font-size: 14px; line-height: 1.5; color: #000; flex: 1; white-space: pre-wrap; padding-top: 4px; }
        .msgbox-text a { color: #0000EE; }
        .msgbox-buttons { padding: 10px; display: flex; justify-content: center; gap: 10px; }
        .msgbox-btn { min-width: 70px; padding: 2px 10px; background: #ece9d8; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff; font-family: 'Tahoma', sans-serif; font-size: 14px; cursor: pointer; }
        .msgbox-btn:active { border-color: #808080 #ffffff #ffffff #808080; }
        .msgbox-btn:focus { outline: 1px dotted #000; outline-offset: -4px; }
        .msgbox-window.stats-mode .msgbox-content {
            padding: 0 15px;
        }
        .msgbox-window.stats-mode .msgbox-text {
            padding-top: 0;
        }
        .msgbox-window.stats-mode .title-bar {
            margin-bottom: 2px;
        }
        .msgbox-window.stats-mode .msgbox-buttons {
            padding: 5px 10px;
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="top-info">
        <div style="flex: 1; display: flex; align-items: center;">
            <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='75' font-size='85' font-weight='900' fill='%23DAA520' text-anchor='middle' style='font-family: Arial, Helvetica, sans-serif;'>K</text></svg>" style="height: 20px; width: 20px;">
        </div>
        <span id="game-title">空当接龙</span>
        <div style="flex: 1; text-align: right;">
            <button class="lang-btn" id="langToggle">中</button>
        </div>
    </div>

    <div class="main-area">
        <div class="game-canvas" id="canvas">
            <div class="slot-row" id="bg-slots">
                <div class="group" id="free-group"></div>
                <div class="group" id="found-group"></div>
            </div>
        </div>
    
        <div class="sidebar-wrapper">
            <div class="bottom-controls">
            <button class="control-btn" id="stats-btn">统计</button>
                <button class="control-btn" id="select-game-btn">选局</button>
                <button class="control-btn" id="new-game-btn">新游戏</button>
                <button class="control-btn" id="hint-btn">提示</button>
                <button class="control-btn" id="undo-btn">撤销</button>
            </div>
            <div class="status-bar">
                <span id="game-info"></span>
                <span id="cards-left-info"></span>
                <span><a href="#" id="aboutLink">XHBL</a> © 2026</span>
            </div>
        </div>
    </div>
</div>

<div id="msgbox-overlay" class="msgbox-overlay" style="display: none;">
    <div class="msgbox-window">
        <div class="title-bar">
            <div class="title">
                <span>空当接龙</span>
            </div>
            <div class="window-controls">
                <div class="win-btn" id="msgbox-close">✕</div>
            </div>
        </div>
        <div class="msgbox-content">
            <div class="msgbox-icon" id="msgbox-icon"></div>
            <div class="msgbox-text" id="msgbox-text"></div>
        </div>
        <div class="msgbox-buttons" id="msgbox-buttons"></div>
    </div>
</div>

<canvas id="victory-canvas"></canvas>

<script>
(function() {
    // ---------- 工具函数：Canvas圆角矩形 (修复瀑布动画) ----------
    const LANG = {
        zh: {
            title: "空当接龙 - 经典版",
            headerTitle: "空当接龙",
            buttons: {
                stats: "统计",
                select: "选局",
                new: "新游戏",
                hint: "提示",
                undo: "撤销"
            },
            status: {
                game: "游戏",
                left: "剩余纸牌"
            },
            about: {
                title: "关于",
                header: "一款基于JavaScript的经典空当接龙游戏",
                version: "v1.0.48 by XHBL",
                email: "newxhbl@hotmail.com"
            },
            newGameTitle: "新游戏",
            confirmNewGameMessage: "游戏正在进行，要开始新的一局吗？",
            replayCurrentGame: "重玩本局",
            selectGameTitle: "选局",
            selectGameMessage: "选择 1 - 1000000 之间的游戏编号:",
            errorTitle: "错误",
            invalidSeedMessage: "请输入 1 到 1000000 之间的有效数字。",
            ok: "确定",
            cancel: "取消",
            yes: "是",
            no: "否",
            close: "关闭",
            winTitle: "恭喜",
            winMessage: "恭喜你获胜了！\n再玩新的一局吗？",
            noMovesTitle: "无路可走",
            noMovesMessage: "当前已无路可走。\n您可以撤销上一步或开始新游戏。",
            stats: {
                title: "统计信息",
                played: "已玩游戏",
                won: "已胜游戏",
                rate: "获胜率",
                maxWin: "最多连胜",
                maxLose: "最多连败",
                current: "当前连局",
                reset: "重置",
                confirmReset: "确定要重置所有统计数据吗？",
                winStreakTag: "连胜",
                loseStreakTag: "连败"
            },
            invalidMove: {
                fromFound: "不能从回收区移动牌",
                stackInvalid: "只能移动颜色交替、点数递减的牌序列",
                tooManyCards: "移动的牌数超过限制",
                colorRankMismatch: "目标位置需要颜色交替且点数递减",
                freeOccupied: "该中转空当已有牌",
                freeSingleOnly: "中转空当只能放置单张牌",
                foundSuitMismatch: "回收区只能放同花色的牌",
                foundRankMismatch: "回收区需要从A开始按顺序放置",
                foundSingleOnly: "回收区只能放置单张牌",
                notLastCard: "只能移动列末尾的牌",
                noFreeSlot: "没有可用的中转空当"
            }
        },
        en: {
            title: "FreeCell - Classic Version",
            headerTitle: "FreeCell",
            buttons: {
                stats: "Stats",
                select: "Select",
                new: "New",
                hint: "Hint",
                undo: "Undo"
            },
            status: {
                game: "Game",
                left: "Cards left"
            },
            about: {
                title: "About",
                header: "A JavaScript-based classic FreeCell game",
                version: "v1.0.48 by XHBL",
                email: "newxhbl@hotmail.com"
            },
            newGameTitle: "New Game",
            confirmNewGameMessage: "A game is in progress. Start a new game?",
            replayCurrentGame: "Replay this game",
            selectGameTitle: "Select Game",
            selectGameMessage: "Enter a game number between 1 - 1,000,000:",
            errorTitle: "Error",
            invalidSeedMessage: "Please enter a valid number between 1 and 1,000,000.",
            ok: "OK",
            cancel: "Cancel",
            yes: "Yes",
            no: "No",
            close: "Close",
            winTitle: "Congratulations",
            winMessage: "You Win!\nPlay a new game?",
            noMovesTitle: "No Moves Left",
            noMovesMessage: "No more moves available.\nYou can undo or start a new game.",
            stats: {
                title: "Statistics",
                played: "Games Played",
                won: "Games Won",
                rate: "Win Percentage",
                maxWin: "Longest Win Streak",
                maxLose: "Longest Lose Streak",
                current: "Current Streak",
                reset: "Reset",
                confirmReset: "Are you sure you want to reset all statistics?",
                winStreakTag: "Wins",
                loseStreakTag: "Losses"
            },
            invalidMove: {
                fromFound: "Cannot move cards from foundation",
                stackInvalid: "Can only move alternating color descending sequences",
                tooManyCards: "Too many cards to move",
                colorRankMismatch: "Target requires alternating colors and descending ranks",
                freeOccupied: "This free cell is occupied",
                freeSingleOnly: "Free cells only accept single cards",
                foundSuitMismatch: "Foundation requires matching suit",
                foundRankMismatch: "Foundation requires ascending rank from Ace",
                foundSingleOnly: "Foundation only accepts single cards",
                notLastCard: "Can only move the last card in a column",
                noFreeSlot: "No free cells available"
            }
        }
    };
    const STORAGE_KEY = 'xjfcel-savegame';
    const STATS_KEY = 'xjfcel-stats';
    const LANG_KEY = 'xjfcel-lang';

    function detectLanguage() {
        const stored = localStorage.getItem(LANG_KEY);
        if (stored) return stored;
        const browserLang = navigator.language || navigator.userLanguage || '';
        return browserLang.includes('zh') ? 'zh' : 'en';
    }
    let currentLang = detectLanguage();

    function t(key, params = {}) {
        let text = key.split('.').reduce((obj, k) => obj && obj[k], LANG[currentLang]);
        if (text === undefined) return key;
        if (typeof text === 'string') {
            for (const [param, value] of Object.entries(params)) {
                text = text.replace(`{${param}}`, value);
            }
        }
        return text;
    }

    function updateUIText() {
        document.title = t('title');
        document.getElementById('game-title').textContent = t('headerTitle');
        document.getElementById('langToggle').textContent = currentLang === 'zh' ? '中' : 'EN';
        
        document.getElementById('stats-btn').textContent = t('buttons.stats');
        document.getElementById('select-game-btn').textContent = t('buttons.select');
        document.getElementById('new-game-btn').textContent = t('buttons.new');
        document.getElementById('hint-btn').textContent = t('buttons.hint');
        document.getElementById('undo-btn').textContent = t('buttons.undo');

        // 尝试更新状态栏（使用 try-catch 防止在 game 对象初始化前调用报错）
        try { updateStatusBar(); } catch (e) {}
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem(LANG_KEY, lang);
        updateUIText();
    }

    let gameStats = {
        played: 0,
        won: 0,
        winStreak: 0,
        maxWinStreak: 0,
        maxLoseStreak: 0
    };

    function loadStats() {
        const s = localStorage.getItem(STATS_KEY);
        if (s) {
            try {
                const parsed = JSON.parse(s);
                Object.assign(gameStats, parsed);
            } catch(e) {}
        }
    }

    function saveStats() {
        localStorage.setItem(STATS_KEY, JSON.stringify(gameStats));
    }

    function updateStatsOnWin() {
        gameStats.played++;
        gameStats.won++;
        if (gameStats.winStreak > 0) {
            gameStats.winStreak++;
        } else {
            gameStats.winStreak = 1;
        }
        if (gameStats.winStreak > gameStats.maxWinStreak) {
            gameStats.maxWinStreak = gameStats.winStreak;
        }
        saveStats();
    }

    function checkAbandonment() {
        // 如果当前游戏有操作记录且未获胜，则视为放弃/失败
        if (game.hasMoved && !game.isWon) {
            gameStats.played++;
            if (gameStats.winStreak < 0) {
                gameStats.winStreak--;
            } else {
                gameStats.winStreak = -1;
            }
            if (Math.abs(gameStats.winStreak) > gameStats.maxLoseStreak) {
                gameStats.maxLoseStreak = Math.abs(gameStats.winStreak);
            }
            saveStats();
        }
    }

    function saveGameState() {
        if (game.isWon) {
            clearSavedGame();
            return;
        }
        const state = {
            seed: game.seed,
            free: game.free,
            found: game.found,
            cols: game.cols,
            history: game.history,
            score: game.score,
            isWon: game.isWon,
            hasMoved: game.hasMoved
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function clearSavedGame() {
        localStorage.removeItem(STORAGE_KEY);
    }

    function loadAndInitialize() {
        updateUIText();
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
            try {
                const state = JSON.parse(savedData);
                if (state.isWon) { // 如果保存的是已获胜的游戏，则开始新局
                    clearSavedGame();
                    return newRandomGame(true);
                }
                Object.assign(game, state); // 恢复游戏状态
                if (state.hasMoved === undefined && game.history.length > 0) {
                    game.hasMoved = true; // 兼容旧存档：如果有历史记录则视为已操作
                }
                updateAndRender(); // 渲染恢复的牌局，不播放发牌动画
            } catch (e) {
                newRandomGame(true); // 解析失败则开始新局
            }
        } else {
            newRandomGame(true); // 没有存档则开始新局
        }
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };
    }

    // ---------- 伪随机数生成器 (Windows FreeCell 算法) ----------
    class MSRand {
        constructor(seed) { this.seed = seed; }
        next() { this.seed = (this.seed * 214013 + 2531011) & 0xFFFFFFFF; return (this.seed >>> 16) & 0x7FFF; }
    }

    const SUITS = ['clubs', 'diamonds', 'hearts', 'spades'];
    const SYMBOLS = { 'hearts':'♥', 'diamonds':'♦', 'clubs':'♣', 'spades':'♠' };

    // 动画辅助函数
    function getCardPosition(pos, cardIndex) {
        let x = 0, y = 0;
        if (pos.type === 'free') {
            x = layout.freeSlotsPos[pos.idx].x;
            y = layout.freeSlotsPos[pos.idx].y;
        } else if (pos.type === 'found') {
            x = layout.foundSlotsPos[pos.idx].x;
            y = layout.foundSlotsPos[pos.idx].y;
        } else if (pos.type === 'cols') {
            x = layout.colsXPos[pos.idx];
            const colY = layout.paddingY + layout.cardH + layout.rowGap;
            y = colY + cardIndex * layout.stackYOffset;
        }
        return { x, y };
    }

    async function animateMove(cards, from, to) {
        const duration = 150;
        const canvas = document.getElementById('canvas');
        const flyers = [];

        let startIdx = 0;
        if (from.type === 'cols') startIdx = game.cols[from.idx].length - cards.length;

        let destIdx = 0;
        if (to.type === 'cols') destIdx = game.cols[to.idx].length;

        for (let i = 0; i < cards.length; i++) {
            const card = cards[i];
            const startPos = getCardPosition(from, startIdx + i);
            
            const el = createCardEl(card, { type: 'animation' });
            el.style.width = `${layout.cardW}px`;
            el.style.height = `${layout.cardH}px`;
            
            let fontSize = Math.max(10, Math.floor(layout.stackYOffset * 0.90));
            const paddingX = (window.innerWidth <= 600 || window.innerHeight <= 500) ? 4 : 8;
            if (fontSize * 2.2 > layout.cardW - paddingX) {
                fontSize = Math.floor((layout.cardW - paddingX) / 2.2);
            }
            el.style.fontSize = `${fontSize}px`;
            el.querySelector('.suit-l').style.fontSize = `${Math.max(20, Math.floor(layout.cardW * 0.9))}px`;

            el.style.position = 'absolute';
            el.style.left = `${startPos.x}px`;
            el.style.top = `${startPos.y}px`;
            el.style.zIndex = 1000 + i;
            el.style.transition = `left ${duration}ms ease-out, top ${duration}ms ease-out`;
            el.style.pointerEvents = 'none';
            el.classList.add('selected');

            // 隐藏原始卡牌，避免“分身”效果
            const originalEl = document.querySelector(`.card[data-id="${card.id}"]`);
            if (originalEl) originalEl.style.visibility = 'hidden';

            canvas.appendChild(el);
            flyers.push({ el, index: i });
        }

        // Force reflow
        if (flyers.length > 0) flyers[0].el.getBoundingClientRect();

        flyers.forEach(({ el, index }) => {
            const destPos = getCardPosition(to, destIdx + index);
            el.style.left = `${destPos.x}px`;
            el.style.top = `${destPos.y}px`;
        });

        await new Promise(r => setTimeout(r, duration));
        flyers.forEach(f => f.el.remove());
    }
